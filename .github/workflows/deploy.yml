name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Configure environment
        env:
          INVENTORY_GOOGLE_SHEETS_ID: ${{ secrets.INVENTORY_GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          PUBLIC_SUBMISSION_ENDPOINT: ${{ secrets.PUBLIC_SUBMISSION_ENDPOINT }}
          PUBLIC_ORDER_TOKEN: ${{ secrets.PUBLIC_ORDER_TOKEN }}
          PUBLIC_GA4_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA4_MEASUREMENT_ID }}
        run: |
          node -e "
          var fs = require('fs');
          var e = process.env;
          var lines = [
            'SHEETS_ENABLED=true',
            'INVENTORY_GOOGLE_SHEETS_ID=\"' + (e.INVENTORY_GOOGLE_SHEETS_ID || '') + '\"',
            'GOOGLE_SERVICE_ACCOUNT_EMAIL=\"' + (e.GOOGLE_SERVICE_ACCOUNT_EMAIL || '') + '\"',
            'GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY=\"' + (e.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY || '').replace(/\n/g, '\\\\n') + '\"',
            'GOOGLE_DRIVE_ROOT_FOLDER_ID=\"' + (e.GOOGLE_DRIVE_ROOT_FOLDER_ID || '') + '\"',
            'PUBLIC_SUBMISSION_ENDPOINT=\"' + (e.PUBLIC_SUBMISSION_ENDPOINT || '') + '\"',
            'PUBLIC_ORDER_TOKEN=\"' + (e.PUBLIC_ORDER_TOKEN || '') + '\"',
            'PUBLIC_GA4_MEASUREMENT_ID=\"' + (e.PUBLIC_GA4_MEASUREMENT_ID || '') + '\"',
          ];
          fs.writeFileSync('.env', lines.join('\n') + '\n');
          "

      - name: Update site (import data, sync assets, build)
        run: npm run update

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
