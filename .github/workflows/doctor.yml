name: RIPPLE Doctor — Weekly Health Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  doctor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Doctor
        run: npm run doctor
        env:
          DOCTOR_EMAIL_ENABLED: ${{ secrets.DOCTOR_EMAIL_ENABLED }}
          DOCTOR_EMAIL_TO: ${{ secrets.DOCTOR_EMAIL_TO }}
          DOCTOR_EMAIL_FROM: ${{ secrets.DOCTOR_EMAIL_FROM }}
          DOCTOR_SMTP_HOST: ${{ secrets.DOCTOR_SMTP_HOST }}
          DOCTOR_SMTP_PORT: ${{ secrets.DOCTOR_SMTP_PORT }}
          DOCTOR_SMTP_USER: ${{ secrets.DOCTOR_SMTP_USER }}
          DOCTOR_SMTP_SECRET: ${{ secrets.DOCTOR_SMTP_SECRET }}
