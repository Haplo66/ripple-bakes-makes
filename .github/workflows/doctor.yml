name: RIPPLE Doctor — Weekly Health Report

on:
  workflow_dispatch:
  push:
    branches:
      - ci-debug-doctor
  schedule:
    - cron: "0 8 * * 1"

jobs:
  doctor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare environment
        env:
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          INVENTORY_GOOGLE_SHEETS_ID: ${{ secrets.INVENTORY_GOOGLE_SHEETS_ID }}
          ORDERS_GOOGLE_SHEETS_ID: ${{ secrets.ORDERS_GOOGLE_SHEETS_ID }}
          PUBLIC_SUBMISSION_ENDPOINT: ${{ secrets.PUBLIC_SUBMISSION_ENDPOINT }}
          PUBLIC_ORDER_TOKEN: ${{ secrets.PUBLIC_ORDER_TOKEN }}
        run: |
          node -e "
          var e = process.env;
          var lines = [
            'GOOGLE_DRIVE_ROOT_FOLDER_ID=\"' + (e.GOOGLE_DRIVE_ROOT_FOLDER_ID || '') + '\"',
            'GOOGLE_SERVICE_ACCOUNT_EMAIL=\"' + (e.GOOGLE_SERVICE_ACCOUNT_EMAIL || '') + '\"',
            'GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY=\"' + (e.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY || '').replace(/\n/g, '\\\\n') + '\"',
            'INVENTORY_GOOGLE_SHEETS_ID=\"' + (e.INVENTORY_GOOGLE_SHEETS_ID || '') + '\"',
            'ORDERS_GOOGLE_SHEETS_ID=\"' + (e.ORDERS_GOOGLE_SHEETS_ID || '') + '\"',
            'PUBLIC_SUBMISSION_ENDPOINT=\"' + (e.PUBLIC_SUBMISSION_ENDPOINT || '') + '\"',
            'PUBLIC_ORDER_TOKEN=\"' + (e.PUBLIC_ORDER_TOKEN || '') + '\"',
          ];
          require('fs').writeFileSync('.env', lines.join('\n') + '\n');
          "

      - name: Diagnose env (temporary)
        run: |
          node -e '
          var fs = require("fs");
          var exists = fs.existsSync(".env");
          console.log("[DIAG] .env exists: " + exists);
          if (!exists) process.exit(0);
          var keyLine = "";
          var lines = fs.readFileSync(".env", "utf-8").split("\n");
          for (var i = 0; i < lines.length; i++) {
            if (lines[i].indexOf("GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY=") === 0) keyLine = lines[i];
          }
          console.log("[DIAG] key line: " + (keyLine ? "found" : "MISSING"));
          if (!keyLine) process.exit(0);
          var body = keyLine.slice("GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY=".length);
          var value = body.charAt(0) === "\"" && body.charAt(body.length - 1) === "\"" ? body.slice(1, -1) : body;
          console.log("[DIAG] file key length: " + value.length);
          console.log("[DIAG] file key literal-backslash-n: " + (value.indexOf("\\n") !== -1));
          console.log("[DIAG] file key real newlines: " + (value.indexOf("\n") !== -1));
          '
          node --env-file=.env -e '
          var k = process.env.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY;
          console.log("[DIAG] decoded key present: " + (!!k));
          if (!k) process.exit(0);
          console.log("[DIAG] decoded key length: " + k.length);
          console.log("[DIAG] decoded key real newlines: " + (k.indexOf("\n") !== -1));
          console.log("[DIAG] decoded BEGIN count: " + ((k.match(/BEGIN PRIVATE KEY/g) || []).length));
          console.log("[DIAG] decoded END count: " + ((k.match(/END PRIVATE KEY/g) || []).length));
          '

      - name: Run Doctor
        run: npm run doctor

      - name: Cleanup environment
        run: rm -f .env
