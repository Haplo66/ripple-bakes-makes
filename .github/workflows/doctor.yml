name: RIPPLE Doctor — Weekly Health Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  doctor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Doctor
        run: node --experimental-strip-types scripts/doctor/doctor.ts
        env:
          PUBLIC_SUBMISSION_ENDPOINT: ${{ secrets.PUBLIC_SUBMISSION_ENDPOINT }}
          PUBLIC_ORDER_TOKEN: ${{ secrets.PUBLIC_ORDER_TOKEN }}
          ORDERS_GOOGLE_SHEETS_ID: ${{ secrets.ORDERS_GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
